<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Queue Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold">Queue System — {{ user.username }} ({{ user.role }})</span>
        
        <div class="d-flex align-items-center gap-2">
            <!-- Stats Link: Visible ONLY for Admin role -->
            {% if user.role == 'Admin' %}
                <a href="{{ url_for('stats') }}" class="btn btn-outline-info btn-sm">Stats Dashboard</a>
            {% endif %}
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Stat Boxes -->
        <div class="row text-center g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card p-3 shadow-sm border-success">
                    <span class="text-muted small fw-bold">SEEN</span>
                    <h3 id="stat-seen" class="text-success fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 shadow-sm border-warning">
                    <span class="text-muted small fw-bold">WAITING</span>
                    <h3 id="stat-waiting" class="text-warning fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 shadow-sm border-info">
                    <span class="text-muted small fw-bold">CALLED</span>
                    <h3 id="stat-called" class="text-info fw-bold mb-0">0</h3>
                </div>
            </div>
        </div>

        {% if user.role in ['Admin', 'Reception'] %}
        <!-- Ticket Generator Buttons -->
        <div class="card shadow-sm p-3 mb-4">
            <h5 class="fw-bold text-secondary mb-3">Create New Patient Ticket</h5>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-info text-white flex-fill" onclick="createTicket('Bloods')">Bloods</button>
                <button class="btn btn-success flex-fill" onclick="createTicket('Scripts')">Scripts</button>
                <button class="btn btn-warning text-white flex-fill" onclick="createTicket('Skin')">Skin</button>
                <button class="btn btn-danger flex-fill" onclick="createTicket('Review')">Review</button>
                <button class="btn btn-primary flex-fill" onclick="createTicket('General Consult')">General Consult</button>
            </div>
            <div class="mt-3">
                <button class="btn btn-dark w-100 fw-bold py-2" onclick="callNext()">CALL NEXT PATIENT</button>
            </div>
        </div>
        {% endif %}

        <!-- Queue Table -->
        <div class="card shadow-sm p-3">
            <h5 class="fw-bold text-secondary mb-3">Active Patient Queue</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Ticket</th>
                            <th>Reason</th>
                            <th>Arrived</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchQueue() {
            try {
                let response = await fetch('/api/queue');
                let data = await response.json();
                
                document.getElementById('stat-seen').innerText = data.total_seen;
                document.getElementById('stat-waiting').innerText = data.waiting_count;
                document.getElementById('stat-called').innerText = data.called_count;

                let tbody = document.getElementById('queue-table-body');
                tbody.innerHTML = '';

                data.tickets.forEach(ticket => {
                    let actionBtn = '';
                    if (ticket.status === 'Called') {
                        actionBtn = `<button class="btn btn-success btn-sm" onclick="markSeen(${ticket.id})">Mark Seen</button>`;
                    } else {
                        actionBtn = `<span class="badge bg-secondary">Waiting</span>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${ticket.ticket_number}</td>
                            <td>${ticket.category}</td>
                            <td>${ticket.created_at.split('T')[1] || ticket.created_at}</td>
                            <td><span class="badge ${ticket.status === 'Called' ? 'bg-info' : 'bg-warning'}">${ticket.status}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error fetching queue data:", err);
            }
        }

        async function createTicket(category) {
            let res = await fetch('/api/ticket/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category })
            });
            let data = await res.json();
            if (data.success) {
                fetchQueue();
            } else {
                alert("Error creating ticket");
            }
        }

        async function callNext() {
            let res = await fetch('/api/ticket/call_next', { method: 'POST' });
            let data = await res.json();
            if (data.success) {
                alert(`CALL PATIENT: Ticket #${data.ticket.ticket_number}`);
                fetchQueue();
            } else {
                alert(data.message || "No patients waiting.");
            }
        }

        async function markSeen(ticketId) {
            let res = await fetch(`/api/ticket/seen/${ticketId}`, { method: 'POST' });
            let data = await res.json();
            if (data.success) {
                fetchQueue();
            }
        }

        // Auto-refresh every 3 seconds for real-time syncing across phones/PCs
        setInterval(fetchQueue, 3000);
        fetchQueue();
    </script>
</body>
</html>
