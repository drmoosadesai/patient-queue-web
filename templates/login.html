<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - MA DESAI INC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #06b6d4;
            --neon-indigo: #4f46e5;
            --neon-purple: #9333ea;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #030712;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Futuristic Background Grid & Floating Particles */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.02);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-style: preserve-3d;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(40px) rotateX(10deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .brand-title {
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-cyan) 50%, var(--neon-indigo) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
            animation: titleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 2px rgba(6, 182, 212, 0.4)); }
            100% { filter: drop-shadow(0 0 10px rgba(79, 70, 229, 0.7)); }
        }

        .icon-box {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .form-control, .input-group-text {
            background: rgba(255, 255, 255, 0.05) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--neon-cyan) !important;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25) !important;
        }

        .form-control::placeholder {
            color: #64748b !important;
        }

        .input-group:hover .input-group-text {
            border-color: rgba(6, 182, 212, 0.4) !important;
            color: var(--neon-cyan) !important;
        }

        /* Futuristic Custom Button */
        .btn-custom {
            background: linear-gradient(135deg, var(--neon-indigo) 0%, var(--neon-cyan) 100%);
            border: none;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-custom::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .btn-custom:hover::before {
            left: 100%;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
        }

        .alert-cyber {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="cyber-grid"></div>

    <div class="container" style="max-width: 440px;">
        <div class="card login-card shadow-lg p-4 p-md-5">
            
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 icon-box" style="width: 64px; height: 64px;">
                    <i class="bi bi-hospital fs-3 text-info"></i>
                </div>
                <h3 class="fw-extrabold brand-title fs-2">MA DESAI INC</h3>
                <p class="text-secondary small tracking-wide mt-1">Next-Gen Patient Queue Management System</p>
            </div>

            {% if error %}
                <div class="alert alert-cyber d-flex align-items-center py-2 text-small mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>{{ error }}</div>
                </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Username ID</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter staff credentials" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">Secure Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter secure key" required>
                        <button class="btn border border-start-0 text-muted" type="button" id="togglePassword">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom text-white w-100 py-3 fw-bold shadow-sm rounded-3">
                    INITIALIZE SESSION <i class="bi bi-terminal-fill ms-1"></i>
                </button>
            </form>

        </div>
        
        <div class="text-center mt-4 text-muted small tracking-wider opacity-75">
            &copy; 2026 MA DESAI INC &bull; Secure Quantum Access Grid
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
